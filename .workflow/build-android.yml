version: "1.0"
name: pipeline-android
displayName: Android APK 云编译
stages:
- name: 构建 APK
  displayName: 构建 APK
  strategy: naturally
  trigger: auto
  steps:
  - step: build@android
    name: build_android
    displayName: Android 构建
    jdkVersion: "17"
    gradleVersion: "9.3"
    buildToolsVersion: 36.1.0
    ndkVersion: 27.3.13750724
    commands:
    - echo "DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY" > .env
    - bash ./scripts/prepare_android_sandbox.sh || echo "沙箱资源准备失败（非阻断，聊天/技能功能不受影响）"
    - mkdir -p $HOME/cmake; curl -fsSL --retry 3 -o $HOME/cmake.tar.gz "https://github.com/Kitware/CMake/releases/download/v3.22.1/cmake-3.22.1-linux-x86_64.tar.gz"
      && tar xzf $HOME/cmake.tar.gz -C $HOME/cmake --strip-components=1 && echo "cmake.dir=$HOME/cmake"
      >> src/android/local.properties && echo "CMake 3.22.1 就绪" || echo "CMake 准备失败（非阻断，构建可能报错）"
    - cd src/android
    - chmod +x gradlew
    - ./gradlew :app:assembleRelease --no-daemon --stacktrace
    artifacts:
    - name: APK
      path:
      - src/android/app/build/outputs/apk/release/*.apk
      type: .tar.gz
    strategy:
      retry: "0"
triggers:
  trigger: auto
  push:
    branches:
      prefix:
      - master
      precise: []
      include: []
notify: []
variables:
  global:
  - DEEPSEEK_API_KEY
