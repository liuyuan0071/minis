name: Android APK 云编译

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Inject DeepSeek API Key
        run: echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" > .env

      - name: Install build tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build make binutils
          echo "构建工具就绪"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: "platforms;android-36 build-tools;36.0.0 ndk;27.3.13750724"

      - name: Build PRoot from source (OpenMinis fork)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.3.13750724"
          echo "NDK_HOME=$ANDROID_NDK_HOME"
          ls "$ANDROID_NDK_HOME" 2>/dev/null || echo "NDK dir not found"
          ls deps/proot/src 2>/dev/null || echo "proot submodule not checked out"
          bash ./deps/build_proot.sh 2>&1 || echo "WARN: PRoot 源码构建失败，将使用预构建二进制"

      - name: Prepare sandbox assets
        run: bash ./scripts/prepare_android_sandbox.sh

      - name: Build APK
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: src/android/app/build/outputs/apk/release/*.apk