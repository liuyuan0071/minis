name: Android APK 云编译

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Inject DeepSeek API Key
        run: echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" > .env

      - name: Prepare sandbox assets
        run: |
          bash ./scripts/prepare_android_sandbox.sh || echo "沙箱资源准备失败（非阻断）"

      - name: Install ninja-build
        run: sudo apt-get update -y && sudo apt-get install -y ninja-build && echo "ninja 就绪"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: "platforms;android-36 build-tools;36.0.0 ndk;27.3.13750724"

      - name: Build APK
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: src/android/app/build/outputs/apk/release/*.apk