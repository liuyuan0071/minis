name: Build Android APK

# 触发条件：推送到 master/main 分支，或手动触发（Gitee Go 流水线页面）
on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 配置 JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      # DEEPSEEK_API_KEY 从 Gitee 仓库密钥注入（仓库 → 管理 → 变量/密钥）。
      # .env 本身被 .gitignore 排除，不会进入仓库；构建脚本在打包时读取该值。
      - name: 写入 .env（注入 DeepSeek Key）
        run: |
          echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" > .env
          if [ -s .env ]; then echo ".env 已写入"; else echo "::warning::未配置 secrets.DEEPSEEK_API_KEY，构建将不注入 Key"; fi

      - name: 配置 Android SDK
        run: |
          set -e
          # 安装 cmdline-tools（sdkmanager）
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd /tmp
          curl -fSL -o cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdtools.zip
          mv cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          export ANDROID_HOME="$HOME/android-sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          # 接受许可
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          # 安装项目所需组件（compileSdk 36 / build-tools / NDK 27 / CMake 3.22.1）
          yes | sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1" \
            > /dev/null
          echo "Android SDK 组件安装完成"

      - name: 写入 local.properties
        run: |
          mkdir -p src/android
          echo "sdk.dir=$HOME/android-sdk" > src/android/local.properties
          echo "local.properties 已生成"

      # 下载 Alpine rootfs + PRoot 二进制到 assets（尽力而为：失败不阻断构建，
      # 聊天/技能等核心工作助手功能不依赖沙箱资产）
      - name: 准备沙箱资源
        continue-on-error: true
        run: |
          bash ./scripts/prepare_android_sandbox.sh || echo "沙箱资源准备失败（非阻断）"

      - name: 编译 Release APK
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v3
        with:
          name: app-release-apk
          path: src/android/app/build/outputs/apk/release/*.apk
