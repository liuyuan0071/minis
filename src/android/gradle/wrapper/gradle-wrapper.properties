distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# [T-gitee-go-build] Use the Tencent Cloud mirror for the Gradle distribution —
# services.gradle.org is unreachable from Gitee Go's build machines (timeout),
# which made every cloud build fail before Gradle even started.
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.11.1-bin.zip
networkTimeout=60000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
